server.port=${PORT:8080}
spring.application.name=api-gateway

# =========================
# Eureka
# =========================
eureka.client.service-url.defaultZone=https://social-media-microservices-xhq9.onrender.com/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true


# =========================
# CORS
# =========================
spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true

spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins[0]=http://localhost:5173
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins[1]=https://social-media-frontend-32gd.onrender.com

spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods[0]=GET
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods[1]=POST
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods[2]=PUT
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods[3]=DELETE
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods[4]=OPTIONS

spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders[0]=Authorization
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders[1]=Content-Type

spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=true


# =========================
# CHAT SERVICE
# =========================
spring.cloud.gateway.routes[0].id=chat-service
spring.cloud.gateway.routes[0].uri=lb://chat-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/chat/**


# =========================
# USER SERVICE
# =========================
spring.cloud.gateway.routes[1].id=user-service
spring.cloud.gateway.routes[1].uri=lb://user-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/users/**


# =========================
# POST SERVICE
# =========================
spring.cloud.gateway.routes[2].id=post-service
spring.cloud.gateway.routes[2].uri=lb://post-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/posts/**


# =========================
# NOTIFICATION SERVICE
# =========================
spring.cloud.gateway.routes[3].id=notification-service
spring.cloud.gateway.routes[3].uri=lb://notification-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/notifications/**


# =========================
# MEDIA SERVICE
# =========================
spring.cloud.gateway.routes[4].id=media-service
spring.cloud.gateway.routes[4].uri=lb://media-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/media/**