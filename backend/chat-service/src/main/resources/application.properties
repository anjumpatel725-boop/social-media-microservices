# =========================================================
# SERVER
# =========================================================
server.port=${PORT:8086}

spring.application.name=chat-service


# =========================================================
# POSTGRESQL DATABASE
# =========================================================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:socialmedia}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver


# =========================================================
# JPA / HIBERNATE
# =========================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect


# =========================================================
# EUREKA CLIENT
# =========================================================
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.client.service-url.defaultZone=${EUREKA_URL:https://social-media-microservices-xhq9.onrender.com/eureka/}


# =========================================================
# EUREKA INSTANCE - RENDER
# =========================================================
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:chat-service}
eureka.instance.prefer-ip-address=false

eureka.instance.non-secure-port-enabled=false
eureka.instance.secure-port-enabled=true
eureka.instance.secure-port=443

eureka.instance.status-page-url=https://${eureka.instance.hostname}/actuator/info
eureka.instance.health-check-url=https://${eureka.instance.hostname}/actuator/health
eureka.instance.home-page-url=https://${eureka.instance.hostname}/


# =========================================================
# ACTUATOR
# =========================================================
management.endpoints.web.exposure.include=health,info,mappings
management.endpoint.health.show-details=always


# =========================================================
# RABBITMQ
# =========================================================
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}