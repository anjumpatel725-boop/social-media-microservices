services:

  # ==========================================
  # API GATEWAY
  # ==========================================
  - type: web
    name: api-gateway
    runtime: docker
    rootDir: backend/api-gateway
    dockerfilePath: ./Dockerfile
    plan: free

    envVars:
      - key: EUREKA_URL
        value: https://social-media-microservices-xhq9.onrender.com/eureka/

      - key: PORT
        value: "8080"


  # ==========================================
  # USER SERVICE
  # ==========================================
  - type: web
    name: user-service
    runtime: docker
    rootDir: backend/user-service
    dockerfilePath: ./Dockerfile
    plan: free

    envVars:
      - key: DB_HOST
        fromDatabase:
          name: socialmedia-db
          property: host

      - key: DB_PORT
        fromDatabase:
          name: socialmedia-db
          property: port

      - key: DB_NAME
        fromDatabase:
          name: socialmedia-db
          property: database

      - key: DB_USERNAME
        fromDatabase:
          name: socialmedia-db
          property: user

      - key: DB_PASSWORD
        fromDatabase:
          name: socialmedia-db
          property: password

      - key: EUREKA_URL
        value: https://social-media-microservices-xhq9.onrender.com/eureka/

      - key: PORT
        value: "8081"


  # ==========================================
  # POST SERVICE
  # ==========================================
  - type: web
    name: post-service
    runtime: docker
    rootDir: backend/post-service
    dockerfilePath: ./Dockerfile
    plan: free

    envVars:
      - key: DB_HOST
        fromDatabase:
          name: socialmedia-db
          property: host

      - key: DB_PORT
        fromDatabase:
          name: socialmedia-db
          property: port

      - key: DB_NAME
        fromDatabase:
          name: socialmedia-db
          property: database

      - key: DB_USERNAME
        fromDatabase:
          name: socialmedia-db
          property: user

      - key: DB_PASSWORD
        fromDatabase:
          name: socialmedia-db
          property: password

      - key: EUREKA_URL
        value: https://social-media-microservices-xhq9.onrender.com/eureka/

      - key: PORT
        value: "8082"


  # ==========================================
  # MEDIA SERVICE
  # ==========================================
  - type: web
    name: media-service
    runtime: docker
    rootDir: backend/media-service
    dockerfilePath: ./Dockerfile
    plan: free

    envVars:
      - key: DB_HOST
        fromDatabase:
          name: socialmedia-db
          property: host

      - key: DB_PORT
        fromDatabase:
          name: socialmedia-db
          property: port

      - key: DB_NAME
        fromDatabase:
          name: socialmedia-db
          property: database

      - key: DB_USERNAME
        fromDatabase:
          name: socialmedia-db
          property: user

      - key: DB_PASSWORD
        fromDatabase:
          name: socialmedia-db
          property: password

      - key: EUREKA_URL
        value: https://social-media-microservices-xhq9.onrender.com/eureka/

      - key: PORT
        value: "8085"


  # ==========================================
  # NOTIFICATION SERVICE
  # ==========================================
  - type: web
    name: notification-service
    runtime: docker
    rootDir: backend/notification-service
    dockerfilePath: ./Dockerfile
    plan: free

    envVars:
      - key: DB_HOST
        fromDatabase:
          name: socialmedia-db
          property: host

      - key: DB_PORT
        fromDatabase:
          name: socialmedia-db
          property: port

      - key: DB_NAME
        fromDatabase:
          name: socialmedia-db
          property: database

      - key: DB_USERNAME
        fromDatabase:
          name: socialmedia-db
          property: user

      - key: DB_PASSWORD
        fromDatabase:
          name: socialmedia-db
          property: password

      - key: EUREKA_URL
        value: https://social-media-microservices-xhq9.onrender.com/eureka/

      # External RabbitMQ / CloudAMQP
      - key: RABBITMQ_HOST
        sync: false

      - key: RABBITMQ_PORT
        value: "5672"

      - key: RABBITMQ_USERNAME
        sync: false

      - key: RABBITMQ_PASSWORD
        sync: false

      - key: PORT
        value: "8084"


  # ==========================================
  # CHAT SERVICE
  # ==========================================
  - type: web
    name: chat-service
    runtime: docker
    rootDir: backend/chat-service
    dockerfilePath: ./Dockerfile
    plan: free

    envVars:
      - key: DB_HOST
        fromDatabase:
          name: socialmedia-db
          property: host

      - key: DB_PORT
        fromDatabase:
          name: socialmedia-db
          property: port

      - key: DB_NAME
        fromDatabase:
          name: socialmedia-db
          property: database

      - key: DB_USERNAME
        fromDatabase:
          name: socialmedia-db
          property: user

      - key: DB_PASSWORD
        fromDatabase:
          name: socialmedia-db
          property: password

      - key: EUREKA_URL
        value: https://social-media-microservices-xhq9.onrender.com/eureka/

      # External RabbitMQ / CloudAMQP
      - key: RABBITMQ_HOST
        sync: false

      - key: RABBITMQ_PORT
        value: "5672"

      - key: RABBITMQ_USERNAME
        sync: false

      - key: RABBITMQ_PASSWORD
        sync: false

      - key: PORT
        value: "8086"


  # ==========================================
  # ANALYTICS SERVICE
  # ==========================================
  - type: web
    name: analytics-service
    runtime: docker
    rootDir: backend/analytics-service
    dockerfilePath: ./Dockerfile
    plan: free

    envVars:
      - key: DB_HOST
        fromDatabase:
          name: socialmedia-db
          property: host

      - key: DB_PORT
        fromDatabase:
          name: socialmedia-db
          property: port

      - key: DB_NAME
        fromDatabase:
          name: socialmedia-db
          property: database

      - key: DB_USERNAME
        fromDatabase:
          name: socialmedia-db
          property: user

      - key: DB_PASSWORD
        fromDatabase:
          name: socialmedia-db
          property: password

      - key: EUREKA_URL
        value: https://social-media-microservices-xhq9.onrender.com/eureka/

      - key: PORT
        value: "8088"


  # ==========================================
  # FRONTEND
  # ==========================================
  - type: web
    name: social-media-frontend
    runtime: static
    rootDir: frontend

    buildCommand: npm install && npm run build

    staticPublishPath: dist

    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: api-gateway
          envVarKey: RENDER_EXTERNAL_URL


# ==========================================
# POSTGRESQL DATABASE
# ==========================================
databases:

  - name: socialmedia-db
    plan: free
    databaseName: socialmedia
    user: socialmedia_user